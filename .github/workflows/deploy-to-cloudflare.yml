name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      
      - name: Build site
        run: npm run build
      
      - name: Debug - Show dist contents
        run: |
          echo "=== Dist directory ==="
          ls -lah dist/
          echo "=== Blog directory ==="
          ls -lah dist/blog/ 2>/dev/null | head -20
      
      - name: Deploy to Cloudflare Pages with verbose output
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Account ID: ${CLOUDFLARE_ACCOUNT_ID:0:10}..." 
          echo "Token: ${CLOUDFLARE_API_TOKEN:0:10}..."
          npx --yes wrangler pages deploy dist \
            --project-name=sheepdogcyberdefense.com \
            --account-id=${CLOUDFLARE_ACCOUNT_ID} \
            --verbose
